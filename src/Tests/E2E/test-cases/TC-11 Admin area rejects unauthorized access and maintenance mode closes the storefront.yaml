labels:
  - nop-e2e
  - maintenance-mode
  - admin-login
  - admin-logout
customSteps: |
  // Runs alone, because it toggles a global store setting. The setting is
  // restored and the storefront re-checked here, so only a failure between the
  // two toggles leaves the instance closed (see README).

  // --- Unauthenticated access is redirected to the login form ---
  go to url stored value "adminUrl"
  check that page contains "Welcome, Please Sign In!"

  // --- Invalid credentials are rejected ---
  enter "not-an-admin@example.com" into "Email"
  enter "wrong_password" into "Password"
  click button "Log in"
  check that page contains "The credentials provided are incorrect"

  admin-login

  // --- Enable maintenance mode ---
  click "Configuration"
  click "Settings"
  click "General settings"
  // "Default store theme" is a non-advanced row, so it is visible whatever the
  // Basic/Advanced switch is set to.
  check that page contains "Default store theme"
  click on the checkbox to the right of "Store closed"
  click button "Save"

  // --- The storefront is closed to shoppers ---
  // Checked while logged out, deliberately: administrators hold
  // PublicStore.AccessClosedStore, so an admin session never sees this page.
  admin-logout
  go to url stored value "storeUrl"
  check that page contains "This store is currently closed"

  // --- Disable it again and confirm the store recovers ---
  admin-login
  click "Configuration"
  click "Settings"
  click "General settings"
  click on the checkbox to the right of "Store closed"
  click button "Save"

  // Logged out again, so the recovery is checked as a shopper; as an admin it
  // would pass whether or not the store reopened.
  admin-logout
  go to url stored value "storeUrl"
  check that page contains "Welcome to our store"
