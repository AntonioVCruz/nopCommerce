  - customer-register-new
  - customer-login
  - customer-logout
  - checkout-address-fill
customSteps: |
  // Full account lifecycle for one generated customer. The password change is
  // proven by an actual re-login, not by the success banner.
  // RegisterValidatorTests and ChangePasswordValidatorTests cover the validation
  // rules; nothing else exercises these forms end to end.

  // --- Register (auto-logs the customer in) ---
  customer-register-new

  // --- Edit the account information ---
  click "My account"
  check that page contains "Customer info"
  enter "Updated" into "First name"
  click button "Save"
  check that page contains "Customer info"

  // --- Change the password ---
  click "Change password"
  check that page contains "Change password"
  enter stored value "customerPassword" into "Old password"
  generate by regex "[A-Z][a-z]{6}[0-9]{2}[!@#]", then enter into "New password" and save as "newPassword"
  enter stored value "newPassword" into "Confirm password"
  // Enter, not a click: the account side menu carries a link reading "Change
  // password" too, so the descriptor is ambiguous and can navigate away.
  press enter
  check that page contains "Password was changed"

  // --- Prove the new password actually works ---
  customer-logout
  save stored value "newPassword" as "customerPassword"
  customer-login

  // --- Add an address book entry ---
  click "My account"
  click "Addresses"
  check that page contains "Addresses"
  click "Add new"
  enter "Updated" into "First name"
  enter stored value "customerLastName" into "Last name"
  enter stored value "customerEmail" into "Email"
  checkout-address-fill
  click button "Save"
  check that page contains "1 Test Street"
