# Boots an ephemeral nopCommerce instance from this checkout, installs it
# unattended, and runs the plain-English testRigor suite in src/Tests/E2E
# against it over the testRigor CLI's localhost tunnel.
#
# Needs two repository secrets: TESTRIGOR_AUTH_TOKEN (a personal access token)
# and TESTRIGOR_SUITE_ID (the WebDesktopChrome suite to drive).
name: E2E tests

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

# --explicit-mutations rewrites the case list of one shared remote suite, so
# runs are serialised across the repository. Queued, not cancelled, so a push
# does not kill a run already in flight.
concurrency:
  group: e2e-suite
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Secrets are not exposed to pull requests from forks, so those are skipped
    # rather than failed; fork contributions are covered once they reach develop.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      # Builds the whole solution inside the image, so this is the slow step.
      - name: Build and start nopCommerce
        run: docker compose up -d --build

      - name: Install nopCommerce unattended
        env:
          BASE_URL: http://localhost
          # /install/restartapplication ends the process and docker-compose.yml
          # declares no restart policy, so the container is cycled explicitly.
          NOP_RESTART_CMD: docker restart nopcommerce
        run: bash src/Tests/E2E/scripts/install-nopcommerce.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install testRigor CLI
        run: npm install --global testrigor-cli

      # The CLI downloads its tunnel client per platform on first use, so a
      # clean runner needs no extra setup. Every case in a run executes
      # concurrently against the one container.
      - name: Run E2E suite
        env:
          TESTRIGOR_AUTH_TOKEN: ${{ secrets.TESTRIGOR_AUTH_TOKEN }}
          TESTRIGOR_SUITE_ID: ${{ secrets.TESTRIGOR_SUITE_ID }}
        run: |
          testrigor test-suite run "$TESTRIGOR_SUITE_ID" \
            --auth-token "$TESTRIGOR_AUTH_TOKEN" \
            --localhost --url "http://localhost" \
            --test-cases-path "src/Tests/E2E/test-cases/*.yaml" \
            --rules-path "src/Tests/E2E/rules/*.txt" \
            --variables-path "src/Tests/E2E/variables.json" \
            --labels nop-e2e \
            --explicit-mutations \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --junit-report-save-path e2e-results.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results.xml
          if-no-files-found: warn

      - name: Dump container logs
        if: failure()
        run: docker compose logs --tail=300
